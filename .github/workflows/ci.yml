name: CI
on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: forma, POSTGRES_DB: forma_test }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FORMA_TEST_DATABASE_URL: postgres://postgres:forma@localhost:5432/forma_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npx tsc -p tsconfig.json
      - run: npm run test:server
      - name: Browser end-to-end
        run: |
          npm i --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
          npm run test:e2e
          npm run test:a11y
          DATABASE_URL=$FORMA_TEST_DATABASE_URL npm run test:sync

  gymcore-linux:
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - run: cd ios/GymCore && swift test
